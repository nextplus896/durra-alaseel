openapi: 3.0.0
info:
  title: 'Dorra Alaseel – Car Rental API'
  description: 'RESTful JSON API for the Dorra Alaseel car rental platform. Response envelope: message.success[] or message.error[], data, type=success|error.'
  contact:
    name: Support
    email: support@dorraalaseel.com
  license:
    name: Proprietary
  version: 1.0.0
servers:
  -
    url: 'http://192.168.1.211:8001'
    description: 'API Server'
paths:
  /api/v1/register:
    post:
      tags:
        - Authentication
      summary: 'Register a new user account'
      operationId: userRegister
      requestBody:
        description: 'New user registration payload.'
        required: true
        content:
          application/json:
            schema:
              required:
                - firstname
                - lastname
                - email
                - password
                - phone
              properties:
                firstname:
                  type: string
                  example: Ahmad
                lastname:
                  type: string
                  example: Al-Rashidi
                email:
                  type: string
                  format: email
                  example: ahmad@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: P@ssw0rd!
                phone:
                  description: 'Phone number including country code.'
                  type: string
                  example: '+966501234567'
                refer:
                  description: 'Referral ID of an existing user (optional).'
                  type: string
                  example: ABCD1234
                  nullable: true
                agree:
                  description: 'Required only when agree_policy is enabled in system settings.'
                  type: string
                  example: 'on'
                  nullable: true
              type: object
      responses:
        200:
          description: 'Registration successful.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'User successfully registered'
                    type: object
                  data:
                    $ref: '#/components/schemas/AuthTokenData'
                  type:
                    type: string
                    example: success
                type: object
        400:
          description: 'User already exists or registration failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: 'Server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/login:
    post:
      tags:
        - Authentication
      summary: 'Authenticate a user and issue a Bearer token'
      operationId: userLogin
      requestBody:
        description: 'Use email address or username in the credentials field.'
        required: true
        content:
          application/json:
            schema:
              required:
                - credentials
                - password
              properties:
                credentials:
                  description: 'User email address or username.'
                  type: string
                  example: aymansaadtest@gmail.com
                password:
                  type: string
                  format: password
                  example: Aym@nS23d
              type: object
      responses:
        200:
          description: 'Login successful.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'User successfully logged in'
                    type: object
                  data:
                    $ref: '#/components/schemas/AuthTokenData'
                  type:
                    type: string
                    example: success
                type: object
        400:
          description: 'Wrong credentials or account suspended.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'User not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/logout:
    post:
      tags:
        - Authentication
      summary: 'Revoke the current Bearer token (logout)'
      operationId: userLogout
      responses:
        200:
          description: 'Successfully logged out.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'Logout success!'
                    type: object
                  data:
                    type: array
                    items: []
                  type:
                    type: string
                    example: success
                type: object
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        500:
          description: 'Server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/password/forgot/find/user:
    post:
      tags:
        - Authentication
      summary: 'Step 1 – Find account and send reset code to email'
      operationId: forgotPasswordSendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - credentials
              properties:
                credentials:
                  description: 'User email address or username.'
                  type: string
                  example: ahmad@example.com
              type: object
      responses:
        200:
          description: 'Verification code sent to email.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'Verification code sended to your email address'
                    type: object
                  data:
                    properties:
                      token:
                        description: 'Pass this token in Steps 2 and 3.'
                        type: string
                        example: abc123def456...
                      wait_time:
                        type: string
                        example: ''
                    type: object
                  type:
                    type: string
                    example: success
                type: object
        400:
          description: 'Account suspended.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'User not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: 'Server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/password/forgot/verify/code:
    post:
      tags:
        - Authentication
      summary: 'Step 2 – Verify the reset code'
      operationId: forgotPasswordVerifyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
                - code
              properties:
                token:
                  description: 'Token received from Step 1.'
                  type: string
                  example: abc123def456...
                code:
                  description: 'Numeric OTP code received by email.'
                  type: integer
                  example: 483921
              type: object
      responses:
        200:
          description: 'OTP verified successfully.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'OTP successfully verified!'
                    type: object
                  data:
                    properties:
                      token:
                        type: string
                        example: abc123def456...
                      wait_time:
                        type: string
                        example: ''
                    type: object
                  type:
                    type: string
                    example: success
                type: object
        400:
          description: 'Invalid OTP.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        440:
          description: 'Session expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/password/forgot/resend/code:
    get:
      tags:
        - Authentication
      summary: 'Step 2b – Resend the password-reset code'
      operationId: forgotPasswordResendCode
      parameters:
        -
          name: token
          in: query
          description: 'Token received from Step 1.'
          required: true
          schema:
            type: string
          example: abc123def456...
      responses:
        200:
          description: 'OTP resent successfully.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'OTP resend success'
                    type: object
                  data:
                    properties:
                      token:
                        type: string
                        example: abc123def456...
                      wait_time:
                        type: string
                        example: ''
                    type: object
                  type:
                    type: string
                    example: success
                type: object
        400:
          description: 'Too soon to resend or invalid token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/password/forgot/reset:
    post:
      tags:
        - Authentication
      summary: 'Step 3 – Set a new password'
      operationId: forgotPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
                - password
                - password_confirmation
              properties:
                token:
                  description: 'Token from Step 1 (must not be expired).'
                  type: string
                  example: abc123def456...
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: NewP@ssw0rd!
                password_confirmation:
                  type: string
                  format: password
                  example: NewP@ssw0rd!
              type: object
      responses:
        200:
          description: 'Password reset successfully.'
          content:
            application/json:
              schema:
                properties:
                  message:
                    properties:
                      success:
                        type: array
                        items:
                          type: string
                          example: 'Password reset success'
                    type: object
                  data:
                    type: array
                    items: []
                  type:
                    type: string
                    example: success
                type: object
        400:
          description: 'Invalid or expired token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: 'Server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/otp/request:
    post:
      tags:
        - Authentication
      summary: 'Request an OTP via SMS or WhatsApp (Twilio Verify)'
      operationId: otpRequest
      requestBody:
        description: 'Send OTP to the given phone number via the chosen channel.'
        required: true
        content:
          application/json:
            schema:
              required:
                - phone
                - channel
              properties:
                phone:
                  description: 'Full E.164 phone number including country code.'
                  type: string
                  example: '+966501234567'
                channel:
                  description: 'Delivery channel: sms or whatsapp.'
                  type: string
                  enum:
                    - sms
                    - whatsapp
                  example: sms
                locale:
                  description: 'Language for the OTP message (default: en).'
                  type: string
                  enum:
                    - en
                    - ar
                    - es
                    - fr
                  example: en
                  nullable: true
              type: object
      responses:
        200:
          description: 'OTP sent successfully.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'OTP sent successfully'
                  data:
                    properties:
                      verification_id:
                        type: string
                        example: VE1234567890abcdef
                      channel:
                        type: string
                        example: sms
                      to:
                        type: string
                        example: '+966501234567'
                      status:
                        type: string
                        example: pending
                    type: object
                type: object
        400:
          description: 'Failed to send OTP (e.g. invalid number, Twilio error).'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to send OTP'
                  error_code:
                    type: string
                    example: '21211'
                    nullable: true
                type: object
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        429:
          description: 'Rate limit exceeded (max 10 requests/minute).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/otp/verify:
    post:
      tags:
        - Authentication
      summary: 'Verify an OTP code (Twilio Verify)'
      operationId: otpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - phone
                - code
              properties:
                phone:
                  description: 'Full E.164 phone number used when requesting the OTP.'
                  type: string
                  example: '+966501234567'
                code:
                  description: '6-digit OTP code received via SMS or WhatsApp.'
                  type: string
                  maxLength: 6
                  minLength: 6
                  example: '482910'
              type: object
      responses:
        200:
          description: 'OTP verified successfully.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Phone verified successfully'
                  data:
                    properties:
                      verification_id:
                        type: string
                        example: VE1234567890abcdef
                      status:
                        type: string
                        example: approved
                    type: object
                type: object
        400:
          description: 'Invalid or expired OTP code.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid verification code'
                  error_code:
                    type: string
                    example: '60200'
                    nullable: true
                type: object
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        429:
          description: 'Rate limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/car-booking/history:
    get:
      tags:
        - Bookings
      summary: "List authenticated user's booking history (paginated)"
      operationId: bookingHistory
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
        -
          name: status
          in: query
          description: 'Filter by status'
          required: false
          schema:
            type: string
            enum:
              - pending
              - booked
              - ongoing
              - completed
              - rejected
              - cancelled
      responses:
        200:
          description: 'Booking history.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Booking history retrieved.'
                  data:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CarBookingResource'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
                      links:
                        $ref: '#/components/schemas/PaginationLinks'
                    type: object
                  errors:
                    type: object
                    example: null
                    nullable: true
                type: object
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/user/car-booking/temp/store:
    post:
      tags:
        - Bookings
      summary: 'Save a temporary (draft) booking'
      operationId: bookingTempStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - car_id
                - pickup_date
                - return_date
              properties:
                car_id:
                  type: integer
                  example: 101
                pickup_date:
                  type: string
                  format: date
                  example: '2025-06-01'
                return_date:
                  type: string
                  format: date
                  example: '2025-06-08'
                delivery:
                  type: boolean
                  example: false
                delivery_address:
                  type: string
                  example: '123 King Fahd Road, Riyadh'
                  nullable: true
                delivery_lat:
                  type: number
                  format: float
                  example: 24.7136
                  nullable: true
                delivery_lng:
                  type: number
                  format: float
                  example: 46.6753
                  nullable: true
              type: object
      responses:
        200:
          description: 'Temporary booking saved.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Booking draft saved.'
                  data:
                    properties:
                      temp_booking_id:
                        type: string
                        example: TB-20250520-9XKL2
                    type: object
                  errors:
                    type: object
                    example: null
                    nullable: true
                type: object
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/user/car-booking/preview:
    get:
      tags:
        - Bookings
      summary: 'Preview booking cost breakdown before confirming'
      operationId: bookingPreview
      parameters:
        -
          name: temp_booking_id
          in: query
          description: 'Temp booking reference'
          required: true
          schema:
            type: string
            example: TB-20250520-9XKL2
      responses:
        200:
          description: 'Booking cost preview.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Booking preview ready.'
                  data:
                    properties:
                      rental_days:
                        type: integer
                        example: 7
                      rental_fees:
                        type: number
                        format: float
                        example: 1050
                      delivery_fee:
                        type: number
                        format: float
                        example: 50
                      tax_rate:
                        type: number
                        format: float
                        example: 15
                      tax_amount:
                        type: number
                        format: float
                        example: 165
                      total_amount:
                        type: number
                        format: float
                        example: 1265
                      currency:
                        type: string
                        example: SAR
                    type: object
                  errors:
                    type: object
                    example: null
                    nullable: true
                type: object
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/user/car-booking/confirm:
    post:
      tags:
        - Bookings
      summary: 'Confirm and submit a booking'
      operationId: bookingConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - temp_booking_id
                - payment_method
              properties:
                temp_booking_id:
                  type: string
                  example: TB-20250520-9XKL2
                payment_method:
                  type: string
                  enum:
                    - wallet
                    - online
                  example: wallet
                payment_gateway_id:
                  type: integer
                  example: 1
                  nullable: true
              type: object
      responses:
        200:
          description: 'Booking confirmed.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Booking confirmed successfully.'
                  data:
                    $ref: '#/components/schemas/CarBookingResource'
                  errors:
                    type: object
                    example: null
                    nullable: true
                type: object
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/user/car-booking/cancel:
    post:
      tags:
        - Bookings
      summary: 'Cancel an active booking'
      operationId: bookingCancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - booking_id
              properties:
                booking_id:
                  type: integer
                  example: 201
                reason:
                  type: string
                  example: 'Change of plans'
                  nullable: true
              type: object
      responses:
        200:
          description: 'Booking cancelled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/user/car-booking/extend/preview:
    get:
      tags:
        - Bookings
      summary: 'Preview the cost of extending a booking'
      operationId: bookingExtendPreview
      parameters:
        -
          name: booking_id
          in: query
          required: true
          schema:
            type: integer
            example: 201
        -
          name: new_return_date
          in: query
          description: 'New return date (YYYY-MM-DD)'
          required: true
          schema:
            type: string
            format: date
            example: '2025-06-15'
      responses:
        200:
          description: 'Extension cost preview.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Extension preview ready.'
                  data:
                    properties:
                      extra_days:
                        type: integer
                        example: 7
                      extra_cost:
                        type: number
                        format: float
                        example: 1050
                      tax_amount:
                        type: number
                        format: float
                        example: 157.5
                      total_due:
                        type: number
                        format: float
                        example: 1207.5
                      currency:
                        type: string
                        example: SAR
                    type: object
                  errors:
                    type: object
                    example: null
                    nullable: true
                type: object
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  /api/v1/user/car-booking/extend:
    post:
      tags:
        - Bookings
      summary: 'Confirm a booking extension'
      operationId: bookingExtend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - booking_id
                - new_return_date
                - payment_method
              properties:
                booking_id:
                  type: integer
                  example: 201
                new_return_date:
                  type: string
                  format: date
                  example: '2025-06-15'
                payment_method:
                  type: string
                  enum:
                    - wallet
                    - online
                  example: wallet
                payment_gateway_id:
                  type: integer
                  example: null
                  nullable: true
              type: object
      responses:
        200:
          description: 'Booking extended.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      security:
        -
          sanctumAuth: []
  '/api/v1/user/car-booking/{bookingId}/extensions':
    get:
      tags:
        - Bookings
      summary: 'List all extensions for a specific booking'
      operationId: bookingExtensionsList
      parameters:
        -
          name: bookingId
          in: path
          description: 'Booking ID'
          required: true
          schema:
            type: integer
            example: 201
      responses:
        200:
          description: 'Booking extensions list.'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Extensions retrieved.'
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          type: integer
                          example: 1
                        extra_days:
                          type: integer
                          example: 7
                        new_return_date:
                          type: string
                          format: date
                          example: '2025-06-15'
                        amount_paid:
                          type: number
                          format: float
                          example: 1207.5
                        created_at:
                          type: string
