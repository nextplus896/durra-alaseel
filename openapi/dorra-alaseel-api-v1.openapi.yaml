              properties:
                MessageSid:
                  type: string
                  example: SM1234567890abcdef1234567890abcdef
                AccountSid:
                  type: string
                  example: AC46cac1e17737ef6a1a33402b7ba83868
                To:
                  type: number
                  example: '+966555123456'
                From:
                  type: number
                  example: '+1234567890'
                MessageStatus:
                  type: string
                  example: delivered
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/x-www-form-urlencoded
      responses:
        '200':
          description: Successful response
