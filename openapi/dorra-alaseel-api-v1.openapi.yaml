openapi: 3.0.0
info:
  title: Dorra Alaseel - Complete API v1 Collection
  description: >-
    Complete API v1 endpoints for Dorra Alaseel Car Rental System - All /api/v1/
    routes
  version: 1.0.0
servers:
  - url: '{{base_url}}'
tags:
  - name: Authentication
  - name: Authentication > User Auth
  - name: Authentication > Vendor Auth
  - name: Authentication > User Authorization
  - name: Authentication > Vendor Authorization
  - name: User - Profile
  - name: User - Dashboard
  - name: User - Transactions
  - name: User - Balance Management
  - name: User - Branches & Delivery
  - name: User - Car Booking
  - name: Vendor - Profile
  - name: Vendor - Dashboard
  - name: Vendor - Cars Management
  - name: Vendor - Bookings
  - name: Vendor - Withdraw
  - name: Vendor - Transactions
  - name: Settings & Global
  - name: Cars (Public)
  - name: OTP Verification
  - name: Webhooks
paths:
  /api/v1/register:
    post:
      tags:
        - Authentication > User Auth
      summary: User Register
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: >-
                "{\n  \"firstname\": \"John\",\n  \"lastname\": \"Doe\",\n 
                \"email\": \"user@example.com\",\n  \"password\":
                \"password123\",\n  \"password_confirmation\":
                \"password123\",\n  \"mobile\": \"+966555123456\",\n 
                \"country\": \"Saudi Arabia\"\n}"
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
