
services:
  # ── Nginx ──────────────────────────────────────────────
  nginx:
    image: nginx:latest
    container_name: durra_nginx
    ports:
      - "${APP_PORT:-8001}:80"
      - "443:443"

    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_started
    networks:
      - durra_network
    restart: unless-stopped

  # ── PHP-FPM (must be named "web" — nginx config references it) ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: durra_web
    expose:
      - "9000"
    environment:
      APP_NAME: "${APP_NAME:-Durra Alaseel}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-durra_db}"
      DB_USERNAME: "${DB_USERNAME:-durra_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"

      CACHE_DRIVER: "${CACHE_DRIVER:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"

      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      REDIS_PORT: "${REDIS_PORT:-6379}"

      BROADCAST_DRIVER: "${BROADCAST_DRIVER:-null}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-}"
      PUSHER_APP_CLUSTER: "${PUSHER_APP_CLUSTER:-mt1}"

      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      MOYASAR_SECRET_KEY: "${MOYASAR_SECRET_KEY:-}"
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - durra_network
    restart: unless-stopped

  # ── MySQL 8 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: durra_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-durra_db}"
      MYSQL_USER: "${DB_USERNAME:-durra_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    networks:
      - durra_network
    restart: unless-stopped

# ── PHPMyAdmin ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: durra_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - durra_network
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: durra_redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - durra_network
    restart: unless-stopped

  # ── Queue Worker (optional — enable by setting QUEUE_CONNECTION=redis) ──
  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: durra_queue
    entrypoint: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-durra_db}
      - DB_USERNAME=${DB_USERNAME:-durra_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - BROADCAST_DRIVER=${BROADCAST_DRIVER:-null}
      - CACHE_DRIVER=${CACHE_DRIVER:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - durra_network
    restart: unless-stopped
    profiles:
      - queue

  # ── Scheduler (Cron) ───────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: durra_scheduler
    entrypoint: ["/bin/sh", "-c", "echo '* * * * * cd /var/www/html && php artisan schedule:run >> /dev/null 2>&1' | crontab - && crond -f -l 2"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-durra_db}
      - DB_USERNAME=${DB_USERNAME:-durra_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - BROADCAST_DRIVER=${BROADCAST_DRIVER:-null}
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - durra_network
    restart: unless-stopped
    profiles:
      - scheduler

# ── Volumes ──────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  bootstrap_cache:
    driver: local
  nginx_logs:
    driver: local

# ── Network ──────────────────────────────────────────────
networks:
  durra_network:
    driver: bridge
